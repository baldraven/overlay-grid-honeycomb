[workspace]

[package]
name = "overlay_grid"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone overlay grid implementation using honeycomb crates"
repository = "https://github.com/your-org/overlay_grid"
readme = "README.md"

[dependencies]
# [dependencies]
honeycomb = { git = "https://github.com/LIHPC-Computational-Geometry/honeycomb", rev = "0ffd41c", features = ["render"]}
thiserror = "1.0"
vtkio = "0.6"
hwlocality = { version = "1.0.0-alpha.11", optional = true }
rayon = "1.11.0"
rand = "0.9.2"
clap = { version = "4.0", features = ["derive"] }

[features]
default = ["bind-threads"]
bind-threads = ["dep:hwlocality"]

[profile.profiling]
inherits = "release"
debug = true
